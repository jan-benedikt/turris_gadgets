[project]
name = "turris-gadgets-home-assistant"
version = "0.1.0"
description = "Home Assistant integration for the Turris Gadgets USB dongle"
requires-python = ">=3.14.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]
ignore = ["ASYNC109", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
